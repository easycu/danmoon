<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorthand Master Pro</title>
<style>
:root { --primary: #4a90e2; --accent: #2ecc71; --bg: #f5f7fa; }

body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 850px;
    background: white;
    padding: 40px;
    border-radius: 20px;
}

.display-sentence {
    font-size: 26px;
    margin: 40px 0;
    line-height: 1.8;
    border: 2px dashed #ddd;
    padding: 10px;
}

.display-sentence b {
    background: var(--primary);
    color: white;
    padding: 0 5px;
    border-radius: 4px;
}

#practice-input {
    width: 100%;
    font-size: 22px;
    padding: 15px;
    border: 2px solid var(--primary);
    border-radius: 10px;
}
</style>
</head>
<body>

<div class="container">

<textarea id="sentence-input" placeholder="문장 입력"></textarea>
<button onclick="saveSentence()">저장</button>
<button onclick="startPractice()">연습 시작</button>

<hr>

<div id="target-sentence" class="display-sentence" contenteditable="true"></div>

<input id="practice-input" placeholder="타이핑">

<br><br>

<button onclick="markAbbreviation()">약어 표시</button>

<p id="progress">0 / 7</p>

</div>

<script>
let sentences = JSON.parse(localStorage.getItem('sh_data')) || [];
let counts = JSON.parse(localStorage.getItem('sh_counts')) || [];

let currentIdx = 0;
let repeat = 0;
let pureTarget = "";

// 저장
function saveSentence() {
    const val = document.getElementById('sentence-input').value.trim();
    if (!val) return;

    sentences.push(val);
    counts.push(0);

    localStorage.setItem('sh_data', JSON.stringify(sentences));
    localStorage.setItem('sh_counts', JSON.stringify(counts));
}

// 연습 시작
function startPractice() {
    pickSentence();
}

// 가중치 선택
function pickSentence() {
    let min = Math.min(...counts);
    let candidates = counts.map((c,i)=> c===min ? i : -1).filter(i=>i!==-1);

    currentIdx = candidates[Math.floor(Math.random()*candidates.length)];
    repeat = 0;
    loadSentence();
}

// 로드
function loadSentence() {
    let raw = sentences[currentIdx];

    document.getElementById('target-sentence').innerHTML =
        raw.replace(/,,(.*?),,/g, '<b>$1</b>');

    pureTarget = raw.replace(/,,/g,'').replace(/\s/g,'');

    document.getElementById('practice-input').value = '';
    updateProgress();
}

// 입력 체크
document.getElementById('practice-input').addEventListener('input', ()=>{
    let val = document.getElementById('practice-input').value.replace(/\s/g,'');

    if (val === pureTarget) {
        repeat++;

        if (repeat >= 7) {
            counts[currentIdx]++;
            localStorage.setItem('sh_counts', JSON.stringify(counts));
            pickSentence();
        } else {
            loadSentence();
        }
    }
});

// 진행 표시
function updateProgress() {
    document.getElementById('progress').innerText = `${repeat} / 7`;
}

// 🔥 핵심 기능
function markAbbreviation() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const selected = sel.toString().trim();
    if (!selected) return;

    let raw = sentences[currentIdx];

    // 이미 포함된 경우 방지
    if (raw.includes(`,,${selected},,`)) return;

    // 해당 위치만 정확히 치환
    let index = raw.indexOf(selected);
    if (index === -1) return;

    let newText =
        raw.slice(0, index) +
        ',,' + selected + ',,' +
        raw.slice(index + selected.length);

    sentences[currentIdx] = newText;

    localStorage.setItem('sh_data', JSON.stringify(sentences));

    loadSentence();
}
</script>

</body>
</html>
